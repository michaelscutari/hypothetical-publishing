services:
  backend:
    build: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/book_publishing
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - CURRENCY_API_APP_ID=${CURRENCY_API_APP_ID}
      - APP_PUBLISHER_NAME=${PUBLISHER_NAME:-Hypothetical Publishing}
      - APP_PUBLISHER_SHORT_NAME=${PUBLISHER_SHORT_NAME:-HP}
      - APP_PUBLISHER_LOGO_URL=${PUBLISHER_LOGO_URL:-/branding/logo.svg}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=book_publishing
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d book_publishing"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Automated database backups — runs pg_dump daily at 2am UTC
  backup:
    build: ./backup
    profiles: [prod]
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - PGPASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_NAME=book_publishing
      - BACKUP_DIR=/backups
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TO=${SMTP_TO:-}
      - BACKUP_ENV=${BACKUP_ENV:-prod}
    volumes:
      - ./backup/backup.sh:/backup/backup.sh:ro
      - ./backups:/backups
      - ${RCLONE_CONFIG:-./rclone.conf}:/root/.config/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend for local development - Vite dev server with HMR
  frontend:
    build:
      context: ./frontend
      target: dev
    profiles: [dev]
    environment:
      - API_DOCS_URL=http://nginx/api-docs
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Frontend for production - nginx serving static files
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    profiles: [prod]
    restart: unless-stopped

  # Local development - no SSL
  nginx:
    image: nginx:alpine
    profiles: [dev]
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Production - with SSL
  nginx-prod:
    image: nginx:alpine
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend-prod
    restart: unless-stopped

volumes:
  postgres_data:
