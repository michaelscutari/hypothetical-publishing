# Common settings
spring.application.name=book-publishing

# Default to dev profile
spring.profiles.active=dev

# Auth settings (override via environment variables in production)
app.jwt-secret=${JWT_SECRET:dev-secret-change-in-production}
app.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.cookie-secure=${COOKIE_SECURE:false}

# External integrations
app.openlibrary.user-agent=${OPENLIBRARY_USER_AGENT:book-publishing/1.0}
app.currency.api-base-url=${CURRENCY_API_BASE_URL:https://openexchangerates.org/api}
app.currency.api-app-id=${CURRENCY_API_APP_ID}

# Cover image thumbnails
app.covers.thumbnail-width=200
app.covers.thumbnail-height=300
