# Development Profile - PostgreSQL
spring.config.activate.on-profile=dev

server.port=8080

# PostgreSQL Database (values overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book_publishing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookpub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger (dev only)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=edu.duke.bookpublishing
springdoc.paths-to-match=/api/**
