<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .box { fill: #f6f6f6; stroke: #c7c7c7; stroke-width: 2; }
    .header { fill: #2f6da4; }
    .title { fill: #ffffff; font: 700 16px Arial, sans-serif; }
    .text { fill: #1f1f1f; font: 12px Arial, sans-serif; }
    .subtext { fill: #6f6f6f; font: 11px Arial, sans-serif; }
    .tag { fill: #e6e6e6; stroke: #d0d0d0; stroke-width: 1; }
    .tagtext { fill: #3a3a3a; font: 10px Arial, sans-serif; }
    .link { stroke: #8c8c8c; stroke-width: 2; fill: none; }
  </style>

  <!-- users -->
  <rect class="box" x="120" y="80" width="520" height="260"/>
  <rect class="header" x="120" y="80" width="520" height="36"/>
  <text class="title" x="136" y="104">users</text>

  <text class="text" x="136" y="140">id</text>
  <text class="subtext" x="430" y="140">bigint</text>
  <rect class="tag" x="560" y="128" width="30" height="16" rx="3"/>
  <text class="tagtext" x="567" y="140">PK</text>
  <rect class="tag" x="598" y="128" width="30" height="16" rx="3"/>
  <text class="tagtext" x="605" y="140">NN</text>

  <text class="text" x="136" y="168">username</text>
  <text class="subtext" x="430" y="168">varchar</text>
  <rect class="tag" x="598" y="156" width="30" height="16" rx="3"/>
  <text class="tagtext" x="605" y="168">NN</text>

  <text class="text" x="136" y="196">password</text>
  <text class="subtext" x="430" y="196">varchar</text>
  <rect class="tag" x="598" y="184" width="30" height="16" rx="3"/>
  <text class="tagtext" x="605" y="196">NN</text>

  <text class="text" x="136" y="224">password_version</text>
  <text class="subtext" x="430" y="224">int</text>
  <rect class="tag" x="598" y="212" width="30" height="16" rx="3"/>
  <text class="tagtext" x="605" y="224">NN</text>

  <!-- authors -->
  <rect class="box" x="960" y="80" width="520" height="260"/>
  <rect class="header" x="960" y="80" width="520" height="36"/>
  <text class="title" x="976" y="104">authors</text>

  <text class="text" x="976" y="140">id</text>
  <text class="subtext" x="1268" y="140">bigint</text>
  <rect class="tag" x="1398" y="128" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1405" y="140">PK</text>
  <rect class="tag" x="1436" y="128" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1443" y="140">NN</text>

  <text class="text" x="976" y="168">name</text>
  <text class="subtext" x="1268" y="168">varchar</text>
  <rect class="tag" x="1436" y="156" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1443" y="168">NN</text>

  <text class="text" x="976" y="196">email</text>
  <text class="subtext" x="1268" y="196">varchar</text>
  <rect class="tag" x="1436" y="184" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1443" y="196">NN</text>

  <!-- books -->
  <rect class="box" x="120" y="420" width="620" height="420"/>
  <rect class="header" x="120" y="420" width="620" height="36"/>
  <text class="title" x="136" y="444">books</text>

  <text class="text" x="136" y="480">id</text>
  <text class="subtext" x="470" y="480">bigint</text>
  <rect class="tag" x="636" y="468" width="30" height="16" rx="3"/>
  <text class="tagtext" x="643" y="480">PK</text>
  <rect class="tag" x="674" y="468" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="480">NN</text>

  <text class="text" x="136" y="504">title</text>
  <text class="subtext" x="470" y="504">varchar</text>
  <rect class="tag" x="674" y="492" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="504">NN</text>

  <text class="text" x="136" y="528">author_id</text>
  <text class="subtext" x="470" y="528">bigint</text>
  <rect class="tag" x="674" y="516" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="528">NN</text>

  <text class="text" x="136" y="552">isbn_13</text>
  <text class="subtext" x="470" y="552">varchar(13)</text>
  <rect class="tag" x="674" y="540" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="552">NN</text>

  <text class="text" x="136" y="576">isbn_10</text>
  <text class="subtext" x="470" y="576">varchar(10)</text>

  <text class="text" x="136" y="600">publication_year</text>
  <text class="subtext" x="470" y="600">int</text>
  <rect class="tag" x="674" y="588" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="600">NN</text>

  <text class="text" x="136" y="624">publication_month</text>
  <text class="subtext" x="470" y="624">int</text>
  <rect class="tag" x="674" y="612" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="624">NN</text>

  <text class="text" x="136" y="648">distributor_author_royalty_rate</text>
  <text class="subtext" x="470" y="648">decimal(5,4)</text>
  <rect class="tag" x="674" y="636" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="648">NN</text>

  <text class="text" x="136" y="672">handsold_author_royalty_rate</text>
  <text class="subtext" x="470" y="672">decimal(5,4)</text>
  <rect class="tag" x="674" y="660" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="672">NN</text>

  <text class="text" x="136" y="696">series_name</text>
  <text class="subtext" x="470" y="696">varchar(256)</text>

  <text class="text" x="136" y="720">series_position</text>
  <text class="subtext" x="470" y="720">int</text>

  <text class="text" x="136" y="744">cover_price</text>
  <text class="subtext" x="470" y="744">decimal(19,2)</text>
  <rect class="tag" x="674" y="732" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="744">NN</text>

  <text class="text" x="136" y="768">print_cost</text>
  <text class="subtext" x="470" y="768">decimal(19,2)</text>
  <rect class="tag" x="674" y="756" width="30" height="16" rx="3"/>
  <text class="tagtext" x="681" y="768">NN</text>

  <text class="text" x="136" y="792">cover_image</text>
  <text class="subtext" x="470" y="792">blob</text>

  <text class="text" x="136" y="816">cover_thumbnail</text>
  <text class="subtext" x="470" y="816">blob</text>

  <text class="text" x="136" y="840">cover_content_type</text>
  <text class="subtext" x="470" y="840">varchar</text>

  <!-- sales -->
  <rect class="box" x="900" y="420" width="560" height="420"/>
  <rect class="header" x="900" y="420" width="560" height="36"/>
  <text class="title" x="916" y="444">sales</text>

  <text class="text" x="916" y="480">id</text>
  <text class="subtext" x="1220" y="480">bigint</text>
  <rect class="tag" x="1368" y="468" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1375" y="480">PK</text>
  <rect class="tag" x="1406" y="468" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="480">NN</text>

  <text class="text" x="916" y="504">book_id</text>
  <text class="subtext" x="1220" y="504">bigint</text>
  <rect class="tag" x="1406" y="492" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="504">NN</text>

  <text class="text" x="916" y="528">sale_source</text>
  <text class="subtext" x="1220" y="528">varchar</text>
  <rect class="tag" x="1406" y="516" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="528">NN</text>

  <text class="text" x="916" y="552">sale_month</text>
  <text class="subtext" x="1220" y="552">int</text>
  <rect class="tag" x="1406" y="540" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="552">NN</text>

  <text class="text" x="916" y="576">sale_year</text>
  <text class="subtext" x="1220" y="576">int</text>
  <rect class="tag" x="1406" y="564" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="576">NN</text>

  <text class="text" x="916" y="600">quantity_sold</text>
  <text class="subtext" x="1220" y="600">int</text>
  <rect class="tag" x="1406" y="588" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="600">NN</text>

  <text class="text" x="916" y="624">publisher_revenue</text>
  <text class="subtext" x="1220" y="624">decimal(19,2)</text>
  <rect class="tag" x="1406" y="612" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="624">NN</text>

  <text class="text" x="916" y="648">author_royalty</text>
  <text class="subtext" x="1220" y="648">decimal(19,2)</text>
  <rect class="tag" x="1406" y="636" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="648">NN</text>

  <text class="text" x="916" y="672">has_author_been_paid</text>
  <text class="subtext" x="1220" y="672">boolean</text>
  <rect class="tag" x="1406" y="660" width="30" height="16" rx="3"/>
  <text class="tagtext" x="1413" y="672">NN</text>

  <text class="text" x="916" y="696">comment</text>
  <text class="subtext" x="1220" y="696">varchar(256)</text>

  <!-- relationships -->
  <path class="link" d="M 960 340 L 740 340 L 740 540"/>
  <path class="link" d="M 740 680 L 900 680"/>
  <text class="subtext" x="748" y="326">author_id</text>
  <text class="subtext" x="748" y="666">book_id</text>
</svg>
