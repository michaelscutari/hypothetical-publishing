<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #1e1e1e; }
      .box-title { font: 700 28px Arial, sans-serif; fill: #1e1e1e; }
      .box-text { font: 400 22px Arial, sans-serif; fill: #1e1e1e; }
      .caption { font: 400 22px Arial, sans-serif; fill: #323232; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f8f8f5" />

  <text x="60" y="90" class="title">Architecture Overview</text>

  <rect x="80" y="160" rx="18" ry="18" width="540" height="220" fill="#e6f4ff" stroke="#2a2a2a" stroke-width="3" />
  <text x="100" y="210" class="box-title">React Frontend</text>
  <text x="100" y="260" class="box-text">• UI Components</text>
  <text x="100" y="295" class="box-text">• Shared Layouts</text>
  <text x="100" y="330" class="box-text">• Data Hooks</text>

  <rect x="670" y="210" rx="18" ry="18" width="260" height="120" fill="#f5ebff" stroke="#2a2a2a" stroke-width="3" />
  <text x="690" y="255" class="box-title">OpenAPI</text>
  <text x="690" y="295" class="box-text">TypeScript Client</text>

  <rect x="980" y="160" rx="18" ry="18" width="540" height="360" fill="#eaf8ea" stroke="#2a2a2a" stroke-width="3" />
  <text x="1000" y="210" class="box-title">Spring Boot Backend</text>
  <text x="1000" y="260" class="box-text">• books package</text>
  <text x="1000" y="295" class="box-text">• sales package</text>
  <text x="1000" y="330" class="box-text">• auth / security</text>
  <text x="1000" y="365" class="box-text">• DTOs + Controllers</text>
  <text x="1000" y="400" class="box-text">• Exception Handling</text>

  <rect x="980" y="600" rx="18" ry="18" width="540" height="180" fill="#fff4e6" stroke="#2a2a2a" stroke-width="3" />
  <text x="1000" y="650" class="box-title">Database</text>
  <text x="1000" y="700" class="box-text">PostgreSQL / H2</text>

  <line x1="620" y1="270" x2="670" y2="270" stroke="#2a2a2a" stroke-width="5" marker-end="url(#arrow)" />
  <line x1="930" y1="270" x2="980" y2="270" stroke="#2a2a2a" stroke-width="5" marker-end="url(#arrow)" />
  <line x1="1250" y1="520" x2="1250" y2="600" stroke="#2a2a2a" stroke-width="5" marker-end="url(#arrow)" />

  <text x="80" y="840" class="caption">DTOs serialized to JSON via Spring + Jackson; OpenAPI generates a typed client for React.</text>
</svg>
